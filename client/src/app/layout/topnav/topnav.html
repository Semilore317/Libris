<header class="h-20 border-l-0 border-t-0 bg-white px-8 flex items-center justify-between">
  <div>
    <h2 class="text-lg font-bold">Library Dashboard</h2>
  </div>

  <div class="flex items-center gap-6">
    <div class="flex flex-col items-end">
      <span class="font-bold text-sm">{{ username() }}</span>
      <span class="text-[10px] text-neutral-400 font-bold uppercase tracking-wider">{{ role() }}</span>
    </div>
    <div class="w-10 h-10 border border-neutral-200 bg-white flex items-center justify-center font-bold text-sm">
      {{ username()?.charAt(0)?.toUpperCase() }}
    </div>
  </div>
</header>
