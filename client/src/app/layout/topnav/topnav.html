<header class="h-20 brutal-border border-l-0 border-t-0 bg-white px-8 flex items-center justify-between">
  <div>
    <h2 class="text-xl font-bold uppercase">Library Dashboard</h2>
  </div>
  
  <div class="flex items-center gap-6">
    <div class="flex flex-col items-end">
      <span class="font-bold uppercase text-sm">{{ username() }}</span>
      <span class="text-xs opacity-60 uppercase">{{ role() }}</span>
    </div>
    <div class="w-10 h-10 brutal-border bg-white flex items-center justify-center font-black">
      {{ username()?.charAt(0) }}
    </div>
  </div>
</header>
