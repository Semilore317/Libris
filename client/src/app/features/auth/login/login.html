<div class="flex min-h-screen bg-white text-black font-mono">
  <!-- Branding Side -->
  <div class="hidden lg:flex flex-1 bg-black text-white p-16 flex-col justify-between items-start select-none">
    <div class="w-24 h-24 bg-white"></div>
    <div>
      <h1 class="text-[120px] font-black leading-[0.8] mb-8">LIB<br>RIS</h1>
      <p class="text-xl max-w-md opacity-80 uppercase font-bold tracking-widest">
        Integrated Library Management System.
        Minimalist. Purposeful. Brutalist.
      </p>
    </div>
    <div class="text-sm border-t border-white pt-4 w-full opacity-50">
      SYSTEM v1.0 // 2026
    </div>
  </div>

  <!-- Form Side -->
  <div class="flex-1 flex items-center justify-center p-8">
    <div class="w-full max-w-md p-10 brutal-border brutal-shadow bg-white">
      <h2 class="text-4xl font-black mb-8 border-b-4 border-black pb-4 uppercase">Identity Access</h2>
      
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="space-y-8">
        <div class="space-y-2">
          <label class="block text-xs font-black uppercase tracking-widest">Operator Username</label>
          <input 
            type="text" 
            formControlName="username"
            class="w-full brutal-border p-4 focus:bg-surface-100 outline-none font-bold uppercase transition-colors"
            placeholder="USER_NAME"
          >
        </div>

        <div class="space-y-2">
          <label class="block text-xs font-black uppercase tracking-widest">Security Protocol Passphrase</label>
          <input 
            type="password" 
            formControlName="password"
            class="w-full brutal-border p-4 focus:bg-surface-100 outline-none font-bold uppercase transition-colors"
            placeholder="********"
          >
        </div>

        <div *ngIf="error()" class="bg-black text-white p-4 font-bold text-xs uppercase brutal-shadow">
          [CRITICAL ERROR]: {{ error() }}
        </div>

        <app-button 
          variant="primary" 
          size="lg" 
          class="w-full block" 
          [disabled]="loading()"
        >
          {{ loading() ? 'Authenticating...' : 'Establish Connection' }}
        </app-button>
        
        <div class="pt-4 border-t-2 border-black flex justify-between text-[10px] font-black opacity-40 uppercase">
          <span>Encrypted Session</span>
          <span>Access Level: Restricted</span>
        </div>
      </form>
    </div>
  </div>
</div>
