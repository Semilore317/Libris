<button 
  class="brutal-button"
  [disabled]="disabled"
  [ngClass]="{
    'bg-black text-white': variant === 'primary',
    'bg-white text-black': variant === 'secondary' || variant === 'outline',
    'px-4 py-1 text-sm': size === 'sm',
    'px-6 py-2 text-base': size === 'md',
    'px-8 py-3 text-lg': size === 'lg'
  }"
>
  <ng-content></ng-content>
</button>
